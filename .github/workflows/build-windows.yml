name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - ci/windows-installer
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build Demetafy (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Demetafy bundles yt-dlp as a Tauri external binary; it is not in git.
      # Validate the download against yt-dlp's published SHA2-256SUMS before use.
      - name: Download and verify Windows yt-dlp sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest'
          $binary = $release.assets | Where-Object { $_.name -eq 'yt-dlp.exe' } | Select-Object -First 1
          $checksums = $release.assets | Where-Object { $_.name -eq 'SHA2-256SUMS' } | Select-Object -First 1
          if (-not $binary -or -not $checksums) {
            throw 'The yt-dlp release does not include yt-dlp.exe and SHA2-256SUMS.'
          }
          New-Item -ItemType Directory -Force 'src-tauri/binaries' | Out-Null
          $destination = 'src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe'
          Invoke-WebRequest -Uri $binary.browser_download_url -OutFile $destination
          Invoke-WebRequest -Uri $checksums.browser_download_url -OutFile 'yt-dlp-SHA2-256SUMS.txt'
          $line = Get-Content 'yt-dlp-SHA2-256SUMS.txt' | Where-Object { $_ -match '^[a-fA-F0-9]{64}\s+\*?yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw 'Could not find yt-dlp.exe in the published SHA256 checksums.' }
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Path $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'yt-dlp SHA256 verification failed.' }
          Write-Host "Verified yt-dlp $($release.tag_name) ($actual)"

      - name: Build Windows NSIS installer
        run: pnpm exec tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Demetafy-Windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
